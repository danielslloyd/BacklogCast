<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BacklogCast</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <header>
    <h1>BacklogCast</h1>
    <div class="row grow">
      <input type="url" id="add-url" placeholder="Paste an article URL…" />
      <button id="add-url-btn" class="primary">Fetch</button>
      <button id="paste-toggle" title="Paste cleaned text instead">Paste text</button>
    </div>
    <input type="search" id="search" placeholder="Filter by title…" />
    <span class="status" id="board-status"></span>
    <button id="menu-btn" class="burger" aria-label="Settings" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <p id="add-status" class="status bar-status"></p>

  <div id="paste-row" class="card hidden">
    <div class="col">
      <input type="text" id="paste-title" placeholder="Title (optional)" />
      <textarea id="paste-text" rows="8" placeholder="Cleaned article text…"></textarea>
      <div class="row">
        <button id="paste-btn" class="primary">Add pasted text</button>
        <button id="paste-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <main>
    <div class="board" id="board"></div>
  </main>

  <!-- settings popup, opened from the burger -->
  <div class="overlay hidden" id="settings-overlay">
    <div class="popup" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="popup-head">
        <h2>Settings</h2>
        <button class="icon-btn" data-close-overlay="settings-overlay" aria-label="Close">✕</button>
      </div>
      <div class="popup-body">
        <section>
          <h3>Podcast</h3>
          <div class="col">
            <label>Title <input id="cfg-title" /></label>
            <label>Description <textarea id="cfg-description" rows="3"></textarea></label>
            <label>Language <input id="cfg-language" /></label>
            <label>Author <input id="cfg-author" /></label>
            <label>Owner name <input id="cfg-owner-name" /></label>
            <label>Owner email <input id="cfg-owner-email" /></label>
            <label>Category <input id="cfg-category" /></label>
            <label class="inline"><input id="cfg-explicit" type="checkbox" /> Explicit</label>
            <label>Public base URL <input id="cfg-base-url" placeholder="https://your.tunnel.example" /></label>
            <label>Words per minute (estimate) <input id="cfg-wpm" type="number" min="60" max="300" /></label>
            <div class="row">
              <button id="save-config" class="primary">Save settings</button>
              <span class="status" id="config-status"></span>
            </div>
          </div>
        </section>

        <section>
          <h3>Feed tokens</h3>
          <p class="status">Anyone with a token can fetch the RSS feed and audio. Revoking a token blocks both immediately.</p>
          <div class="row">
            <input id="new-token-name" placeholder="e.g. alice, phone" />
            <button id="create-token-btn">Create token</button>
          </div>
          <table id="tokens-table">
            <thead><tr><th>Name</th><th>Feed URL</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </section>
      </div>
    </div>
  </div>

  <!-- article detail, opened from a card -->
  <div class="overlay hidden" id="preview-overlay">
    <div class="popup wide" role="dialog" aria-modal="true" aria-label="Article">
      <div class="popup-head">
        <h2 id="preview-title">Preview</h2>
        <button class="icon-btn" data-close-overlay="preview-overlay" aria-label="Close">✕</button>
      </div>
      <div class="popup-body">
        <p class="status" id="preview-meta"></p>
        <div id="audio-wrap" class="hidden">
          <audio id="audio-player" controls></audio>
        </div>
        <div class="preview-row">
          <div class="preview-col">
            <label>Title <input type="text" id="edit-title" /></label>
            <label>Author <input type="text" id="edit-author" /></label>
            <label>Markdown
              <textarea id="edit-body" rows="20"></textarea>
            </label>
          </div>
          <div class="preview-col">
            <div id="rendered" class="rendered"></div>
          </div>
        </div>
      </div>
      <div class="popup-foot row wrap">
        <button id="save-btn" class="primary">Save edits</button>
        <button id="reextract-btn">Re-extract</button>
        <button id="approve-btn">Narrate</button>
        <button id="retry-btn">Retry</button>
        <button id="publish-btn">Publish</button>
        <button id="unpublish-btn">Unpublish</button>
        <button id="delete-audio-btn">Delete audio</button>
        <button id="delete-btn" class="danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
